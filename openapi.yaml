openapi: 3.1.0
info:
  title: TimGym
  version: 1.0.0
  description: Log and review the authenticated user's workout history. Each API key is private to one TimGym account.
servers:
  - url: https://gym.tim0tei.fun
security:
  - bearerAuth: []
paths:
  /api/me:
    get:
      operationId: getMyTimGymAccount
      summary: Check which TimGym account is connected
      responses:
        "200":
          description: Connected account
          content:
            application/json:
              schema:
                type: object
                properties:
                  username: { type: string }
                required: [username]
        "401":
          description: Missing or invalid API key
  /api/live/start:
    post:
      operationId: startLiveWorkout
      summary: Start a live strength workout and notify my phone
      description: >-
        Meant for an iOS Shortcuts automation that runs when a strength workout starts on Apple Watch.
        Opens a live logging session (or returns the one already open in the last 4 hours) and sends a
        push notification that opens it. Body is optional.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                activity: { type: string, description: "Workout name shown on the page, e.g. Traditional Strength Training" }
      responses:
        "201":
          description: A new session was opened
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_id: { type: integer }
                  url: { type: string }
                  created: { type: boolean }
                  notified_devices: { type: integer }
        "200":
          description: The session already open was returned
        "401":
          description: Missing or invalid API key
  /api/live/end:
    post:
      operationId: endLiveWorkout
      summary: Mark the live workout's watch session as ended and remind me to save it
      responses:
        "200":
          description: Reminder sent, or no live workout was open
        "401":
          description: Missing or invalid API key
  /api/health:
    post:
      operationId: importAppleHealth
      summary: Import Apple Health workouts and daily totals
      description: >-
        Accepts Health Auto Export's REST API JSON (version 2, {"data": {"workouts": [...], "metrics": [...]}})
        or a simple shape. Workouts are matched by id (or start time and name), and daily totals replace earlier
        values for the same day, so re-sending data never creates duplicates. Energy in kJ and distances in miles
        are converted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                workouts:
                  type: array
                  items:
                    type: object
                    properties:
                      id: { type: string }
                      name: { type: string, description: Activity name, e.g. Outdoor Run }
                      start: { type: string, description: "ISO 8601 or yyyy-MM-dd HH:mm:ss Z" }
                      duration_min: { type: number }
                      active_kcal: { type: number }
                      distance_km: { type: number }
                    required: [name, start]
                daily:
                  type: array
                  items:
                    type: object
                    properties:
                      date: { type: string, format: date }
                      active_kcal: { type: number }
                      steps: { type: number }
                    required: [date]
      responses:
        "200":
          description: Import summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  workouts_saved: { type: integer }
                  days_saved: { type: integer }
                  skipped: { type: integer }
        "400":
          description: The payload could not be read
        "401":
          description: Missing or invalid API key
  /api/workouts:
    get:
      operationId: listMyWorkouts
      summary: List my recent workouts
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Workouts belonging to the connected account
          content:
            application/json:
              schema:
                type: object
                properties:
                  workouts:
                    type: array
                    items:
                      type: object
                      properties:
                        date: { type: string, format: date }
                        exercise: { type: string }
                        sets:
                          type: array
                          items:
                            type: object
                            properties:
                              reps: { type: integer }
                              weight_kg: { type: [number, "null"] }
                              rpe: { type: [number, "null"] }
                        notes: { type: string }
    post:
      operationId: logWorkout
      summary: Log today's workout or a workout on a specified date
      description: Save multiple exercises and each set's reps, weight in kilograms, and optional RPE. Ask the user to confirm the workout details before saving.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                date: { type: string, format: date, description: Defaults to today if omitted }
                exercises:
                  type: array
                  minItems: 1
                  maxItems: 30
                  items:
                    type: object
                    properties:
                      name: { type: string, maxLength: 80 }
                      notes: { type: string, maxLength: 500 }
                      sets:
                        type: array
                        minItems: 1
                        maxItems: 99
                        items:
                          type: object
                          properties:
                            reps: { type: integer, minimum: 1, maximum: 999 }
                            weight_kg: { type: [number, "null"], minimum: 0, maximum: 2000 }
                            rpe: { type: [number, "null"], minimum: 1, maximum: 10 }
                          required: [reps]
                    required: [name, sets]
              required: [exercises]
      responses:
        "201":
          description: Workout saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  workout_id: { type: string, format: uuid }
                  date: { type: string, format: date }
                  exercises_saved: { type: integer }
        "400":
          description: Invalid workout data
        "401":
          description: Missing or invalid API key
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: TimGym API key
